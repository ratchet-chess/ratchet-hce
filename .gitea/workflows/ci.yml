name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build engine
        run: bun run build:wasm

      # Default perft depths: bun test/perft.ts --full stays a manual gate,
      # because the runners are low-power mini PCs.
      - name: Move generation and incremental state
        run: bun run test
